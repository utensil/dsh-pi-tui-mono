name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Unit + regression suite: no model interaction anywhere in these tests.
      - run: pnpm test

      # Extension smoke + dispatch: the SAME short list as the reference
      # device's pi install — each package must load, register, pass the
      # static ABI analysis (no FATAL interface gaps), and have its event
      # handlers run through the adapter without failures. The packages are
      # devDependencies, so resolveExtensionDir() finds them in node_modules.
      - run: node --test packages/extensions/test/smoke.test.js
      - run: node --test packages/extensions/test/dispatch.test.js

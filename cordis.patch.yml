# @dsh-pi/tui — pi's real TUI as the dsh front door.
#
# Rows registered over @deepseek-ai/dsh-base:
#   - tui-startup  : parses dsh --profile tui-pi args, exposes ctx.tuiStartup.sessionId
#   - tui          : mounts pi's InteractiveMode, bridged to the dsh agent-loop.
#
# agent-loop is repointed to the TUI's startup-owned session identity, mirroring
# @dsh-tui/dsh-tui (patch replaces the row's whole config).

- id: agent-loop
  inject: [tuiStartup]
  config:
    agents:
      - id: main
        provider: deepseek-official
        model: deepseek-v4-pro
        cwd: !!js process.cwd()

# Full thinking at max effort (mirrors @dsh-tui/dsh-tui). Key and endpoint
# resolve per request from the credentials store.
- id: llm-deepseek
  config:
    thinking: enabled
    reasoningEffort: max

- insert:
    - id: tui-startup
      name: 'dsh-pi-tui-shim/startup'

    # Durable session projections (same storage root the web surface uses).
    - id: storage
      name: '@deepseek-ai/dsh-storage'
    - id: storage-json
      name: '@deepseek-ai/dsh-storage-json'
      config:
        root: !!js dshHomePath('storages')
    - id: storage-domain
      name: '@deepseek-ai/dsh-storage-domain'
      config:
        backend: json
    - id: session-projection-cache
      name: '@deepseek-ai/dsh-session-projection-cache'
      config:
        writeEveryEvents: 200
        writeIntervalMs: 5000

    - id: tui
      name: 'dsh-pi-tui-shim'
      inject: [tuiStartup]
      config:
        sessionId: !!js ctx.tuiStartup.sessionId
